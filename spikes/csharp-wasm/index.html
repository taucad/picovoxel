<!doctype html>
<meta charset="utf-8">
<title>PicoGK C# in the browser</title>
<pre id="out">loading…</pre>
<script type="module">
  import { dotnet } from './_framework/dotnet.js';
  const out = document.getElementById('out');
  const params = new URLSearchParams(location.search);
  const args = [params.get('voxel') ?? '0.5', params.get('runs') ?? '3'];
  const log = console.log.bind(console);
  out.textContent = '';
  console.log = (...a) => { out.textContent += a.join(' ') + '\n'; log(...a); };
  const runtime = await dotnet.withApplicationArguments(...args).create();
  const code = await runtime.runMain();
  out.textContent += `exit ${code}\n`;
  document.title = 'done';
</script>
