packages:
  - .

allowBuilds:
  nx: true

linkWorkspacePackages: true

# pnpm 11 reads only auth and registry keys from .npmrc, so the exact-pin rule
# lives here: `pnpm add` writes 1.2.3, never ^1.2.3.
saveExact: true

# Dev-only transitive advisories (high) that the CI audit gate fails on,
# pinned to the patched releases as nanoraster does.
overrides:
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  'smol-toml@<=1.7.0': 1.7.1
