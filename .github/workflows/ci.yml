# The candidate pipeline (PicoVoxel close-out T1.1; create-repo §3). Both wasm
# variants are built once from pinned sources; one candidate tarball is packed
# from them; every test, consumer, browser and preview job exercises those
# exact bytes, and nothing downstream of `wasm` runs emcc. `ci-gate` is the only
# required check. This file name is part of the npm Trusted Publisher identity.
#
# Replaces test.yml. Its macOS leg is dropped rather than scheduled: the wasm is
# platform-independent, the three-engine browser gate covers the Safari claim
# (WebKit), arm64 native parity is a local harness (bench/), and macOS minutes
# cost 10x on a private repository.
#
# OSV scanning is its own workflow (osv-scan.yml: report-only on pull requests,
# blocking on main). Still to come, by owner: ci-release.mjs, the Version Plan
# check, publish and registry verification (PR5, T1.6).
#
# Performance and identity admission (close-out D32): the wasm job fails on a
# wasm byte ceiling (scripts/wasm-manifest.mjs), quality on a JavaScript size
# budget (.size-limit.json), g0 on a G0 identity break of the CI-built pthread
# artifact, consumer on the packed candidate's 2.0 mm HeatX G0 pin, and
# benchmark on the one wall-clock gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_FLOOR: '22.14.0'
  NODE_LATEST: '26'
  # Every test file runs exactly once with v8 coverage into a vitest blob; the
  # `coverage` job merges the blobs and enforces the 100% thresholds from
  # vitest.config.ts over the union, as the single-job `npm test` did.
  VITEST_BLOB_FLAGS: >-
    --coverage
    --coverage.reporter=text-summary
    --coverage.thresholds.lines=0
    --coverage.thresholds.functions=0
    --coverage.thresholds.branches=0
    --coverage.thresholds.statements=0
    --reporter=default
    --reporter=blob

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PR5 (T1.6) replaces this with scripts/ci-release.mjs, which derives the
      # release kind from the commit subject and changed files. Until then no
      # run is a release, so publish stays off.
      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            pull_request) kind=pull-request ;;
            push) kind=main ;;
            *) kind=dispatch ;;
          esac
          {
            echo "kind=$kind"
            echo 'npm_publish=false'
            echo "version=$(node -p "require('./package.json').version")"
          } >> "$GITHUB_OUTPUT"

  # The only place a pull request builds shipped wasm (coverage-cpp builds an
  # instrumented serial variant that never leaves its job). The build steps, and
  # the cache keys that make a near miss impossible, live in
  # .github/actions/build-wasm, which the bench and g0-nightly workflows share
  # for their fallback build.
  wasm:
    name: wasm (${{ matrix.variant }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        variant: [serial, multi]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/build-wasm
        with:
          variant: ${{ matrix.variant }}
      - name: The committed ABI manifest matches the pinned header
        if: matrix.variant == 'serial'
        run: node scripts/parse-abi.mjs | diff -u src/abi.json -
      - name: No builder path is embedded in the shipped bytes (D27)
        run: |
          if grep -aF -c "$GITHUB_WORKSPACE" src/pico*.mjs src/pico*.wasm; then
            echo "::error::a shipped wasm artifact embeds the build path $GITHUB_WORKSPACE"
            exit 1
          fi
      - name: Record sizes and digests, and enforce the byte ceilings
        run: |
          source vendor/emsdk/emsdk_env.sh >/dev/null 2>&1
          EMCC_VERSION="$(emcc --version | head -n1)" node scripts/wasm-manifest.mjs '${{ matrix.variant }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-${{ matrix.variant }}
          path: |
            src/pico${{ matrix.variant == 'multi' && '-multi' || '' }}.mjs
            src/pico${{ matrix.variant == 'multi' && '-multi' || '' }}.wasm
            src/pico${{ matrix.variant == 'multi' && '-multi' || '' }}.exports.ts
            build/wasm-${{ matrix.variant }}.json
            vendor/PicoGKRuntime/API/PicoGK.h
          if-no-files-found: error

  quality:
    needs: [preflight, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      # Build (which fails on a runtime import cycle), typecheck (after build:
      # examples import the package by name), script tests, JS size budgets, the
      # exact file set, publint and attw. `quality` is exactly this target plus
      # `docs-prose`, which runs in its own job, so no gate runs twice. The suite
      # itself runs sharded below (D28), not here.
      - run: pnpm nx run picovoxel:package-checks

  # Format, type-aware lint, dead code, Vale and the prose tests, actionlint and
  # shellcheck. It downloads the wasm only because lint reads the built dist/
  # types (the examples import the package by name) and the build copies it.
  docs-prose:
    needs: [preflight, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - run: pnpm nx run picovoxel:docs-prose

  candidate:
    needs: [preflight, quality, docs-prose, wasm]
    runs-on: ubuntu-24.04
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      integrity: ${{ steps.pack.outputs.integrity }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - run: pnpm run build
      - id: pack
        run: |
          mkdir -p candidate
          npm pack --ignore-scripts --pack-destination candidate
          node scripts/candidate-manifest.mjs candidate
          # The tarball's real entries equal PACKAGE_FILES, CI-built wasm included.
          node scripts/validate-pack.mjs candidate/*.tgz
          node -e "const m=require('./candidate/manifest.json');for(const p of m.packages)console.log(p.name+'@'+p.version, p.filename, p.integrity)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate
          path: candidate/
          if-no-files-found: error

  # The light files against the sources on the Node floor and latest, with both
  # wasm artifacts in src/ and the pinned header they were built against (the
  # ABI consistency test reads it). The latest leg writes the coverage blob. R14
  # (every export exercised) runs on both artifacts.
  test-unit:
    name: test-unit (node ${{ matrix.node }})
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '26']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts vendor/PicoGKRuntime/API/PicoGK.h
      - name: Light files (coverage blob on the latest leg)
        env:
          COVERAGE: ${{ matrix.node == env.NODE_LATEST }}
        run: |
          if [[ "$COVERAGE" == true ]]; then
            # shellcheck disable=SC2086 # the flags are a word list by design
            pnpm run test:unit $VITEST_BLOB_FLAGS --outputFile.blob=.vitest-reports/blob-unit.json
          else
            pnpm run test:unit
          fi
      - name: R14 on the pthread artifact
        run: pnpm exec vitest run test/tier2.test.mjs
        env:
          PICOVOXEL_R14_ARTIFACT: multi
      - if: matrix.node == env.NODE_LATEST
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-unit
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error

  # The own C++ TUs at 100% lines and functions each, measured by source-based
  # coverage (COVERAGE=1: clang profile instrumentation of the nine TUs only) over
  # the light files. The instrumented serial build replaces src/pico.* in this job
  # alone; the pthread pair comes from `wasm`, because the light files load both.
  # The gate script holds the audited exclusions; regions and branches may not
  # fall below scripts/coverage-cpp-ratchet.json.
  coverage-cpp:
    needs: [preflight, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/build-wasm
        with:
          variant: serial
          coverage: 'true'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm-multi
          path: .
          expect: src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - name: Light files against the instrumented serial build
        env:
          PICOVOXEL_CPP_COVERAGE_DIR: ${{ runner.temp }}/profraw
        run: pnpm run test:unit
      - name: Merge the profiles into lcov and the llvm-cov summary
        env:
          PROFILE_DIR: ${{ runner.temp }}/profraw
          OUT_DIR: coverage/cpp
        run: bash scripts/coverage-cpp-report.sh
      - name: 100% lines and functions per TU; regions and branches ratcheted
        run: node scripts/coverage-cpp-gate.mjs coverage/cpp/lcov.info coverage/cpp/summary.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-cpp
          path: |
            coverage/cpp/lcov.info
            coverage/cpp/report.txt
            coverage/cpp/summary.json
          if-no-files-found: error

  # The heavy subjects (~1,833 s of the suite) are the pin-protection gate, so
  # they run on every pull request (close-out D28), sharded because roverwheel
  # alone takes ~754 s: roverwheel | every other examples-* file. The shards,
  # g0 and test-unit partition the suite by construction. They run against the
  # candidate: dist/ is the extracted tarball (examples import the package by
  # name) and src/ holds the same CI-built wasm the tests import directly.
  test-subjects:
    name: test-subjects (${{ matrix.shard }})
    needs: [wasm, candidate]
    strategy:
      fail-fast: false
      matrix:
        shard: [roverwheel, examples]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - name: Use the candidate's dist/
        run: tar -xzf candidate/*.tgz --strip-components=1 package/dist
      - name: Run the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            roverwheel) files=(test/examples-roverwheel.test.ts) ;;
            examples)
              files=()
              for file in test/examples-*.test.ts; do
                [[ "$file" == test/examples-roverwheel.test.ts ]] || files+=("$file")
              done
              ;;
          esac
          echo "shard $SHARD: ${files[*]}"
          # shellcheck disable=SC2086 # the flags are a word list by design
          pnpm exec vitest run "${files[@]}" $VITEST_BLOB_FLAGS --outputFile.blob=".vitest-reports/blob-$SHARD.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error

  # The per-commit G0 identity gate (close-out D32, §3.4): N=2 run-to-run
  # identity plus the pinned reference, HeatX on the pthread build at 1.0 and
  # 0.7 mm (test/g0-gate.test.ts). It certifies the CI-built wasm-multi, the
  # only artifact it downloads, in its own job beside the other subjects; the
  # nightly rotation (g0-nightly.yml) stays as it is.
  g0:
    needs: [wasm, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm-multi
          path: .
          expect: src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - name: Use the candidate's dist/
        run: tar -xzf candidate/*.tgz --strip-components=1 package/dist
      - name: G0 identity and reference on the pthread artifact
        run: |
          # shellcheck disable=SC2086 # the flags are a word list by design
          pnpm exec vitest run test/g0-gate.test.ts $VITEST_BLOB_FLAGS --outputFile.blob=.vitest-reports/blob-g0-gate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-g0-gate
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error

  # The one wall-clock gate (close-out D32; create-repo §5.2). bench/gated.mjs
  # times heatx-multi-fast-1.0mm-e2e-v1 on this run's candidate and on the base
  # branch's: the green ci.yml run at the pull request's base commit, else the
  # newest green one, holding wasm-multi and npm-candidate (only push runs when
  # the base is the default branch; a stacked pull request's base branch has
  # only pull request and manual runs). One warm-up and 15 iterations each,
  # interleaved on this runner. bench/gates.mjs fails it on a G0 tuple change
  # (admitted only by renaming the benchmark) and, once this runner class has an
  # A/A calibration, on a median slowdown over its threshold; it updates one
  # marker-keyed comment. A manual dispatch times this tree against itself: the A/A run that
  # calibrates the class. A push to main has nothing to compare and passes.
  benchmark:
    needs: [wasm, candidate]
    runs-on: ubuntu-24.04
    # Origin: 13.7-14.0 s per iteration on linux-x64-4cpu (the first run, 15
    # head-only iterations in 4 min), so ~8 min for two trees with their
    # fingerprinted warm-ups; the margin covers slower runners and cold caches.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Find the base branch's tested artifacts
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          events=()
          [[ "$BASE_REF" == "$DEFAULT_BRANCH" ]] && events=(--event push)
          found=''
          newest=''
          while read -r run_id sha; do
            live="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select((.expired | not) and (.name == "wasm-multi" or .name == "npm-candidate"))] | length')"
            [[ "$live" == 2 ]] || continue
            [[ -n "$newest" ]] || newest="$run_id $sha"
            if [[ "$sha" == "$BASE_SHA" ]]; then
              found="$run_id $sha"
              break
            fi
          done < <(gh run list --repo "$REPO" --workflow ci.yml --branch "$BASE_REF" "${events[@]}" --status success --limit 20 \
            --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"')
          found="${found:-$newest}"
          if [[ -n "$found" ]]; then
            read -r run_id sha <<< "$found"
            echo "comparing against $BASE_REF at $sha (ci.yml run $run_id; the pull request's base is $BASE_SHA)"
            { echo "run-id=$run_id"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no green $BASE_REF run holds wasm-multi and npm-candidate; the benchmark is admitted without a comparison"
          fi
      - if: github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'push'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LATEST }}
      - if: github.event_name != 'push'
        uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm-multi
          path: .
          expect: src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - if: github.event_name != 'push'
        uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - if: steps.base.outputs.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base-tree
          persist-credentials: false
      - if: steps.base.outputs.sha
        uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm-multi
          path: base-tree
          run-id: ${{ steps.base.outputs.run-id }}
          github-token: ${{ github.token }}
          expect: src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - if: steps.base.outputs.sha
        uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: base-tree/candidate
          run-id: ${{ steps.base.outputs.run-id }}
          github-token: ${{ github.token }}
          expect: manifest.json
      - name: Time both trees
        if: github.event_name != 'push'
        env:
          BASE: ${{ steps.base.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          tar -xzf candidate/*.tgz --strip-components=1 package/dist
          arguments=(--head .)
          if [[ "$EVENT" != pull_request ]]; then
            arguments+=(--aa)
          elif [[ -n "$BASE" ]]; then
            tar -xzf base-tree/candidate/*.tgz -C base-tree --strip-components=1 package/dist
            arguments+=(--base base-tree)
          fi
          node bench/gated.mjs "${arguments[@]}" --out benchmark.json
      - id: compare
        if: github.event_name != 'push'
        continue-on-error: true # Origin: the comment below must report a failed comparison before the gate closes.
        env:
          BASE: ${{ steps.base.outputs.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          node bench/gated.mjs --compare benchmark.json benchmark.md || status=$?
          if [[ -n "$BASE" && "$BASE" != "$BASE_SHA" ]]; then
            printf '\nNo green run holds the artifacts of the base commit %s yet, so the newest green one stands in; changes between the two count against this pull request.\n' \
              "\`${BASE_SHA:0:7}\`" >> benchmark.md
          fi
          tee -a "$GITHUB_STEP_SUMMARY" < benchmark.md
          exit "$status"
      - name: Update the benchmark comment
        if: always() && steps.compare.outcome != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          comment="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.body | contains("<!-- picovoxel-benchmark -->")) | .id')"
          comment="${comment%%$'\n'*}"
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment" -F body=@benchmark.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@benchmark.md >/dev/null
          fi
      - if: always() && steps.compare.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          path: benchmark.json
          if-no-files-found: warn
      - if: steps.compare.outcome == 'failure'
        run: exit 1
      - if: github.event_name == 'push'
        run: echo 'A push to main has no base to compare; pull requests and manual runs time the benchmark.'

  coverage:
    needs: [test-unit, test-subjects, g0]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: 'true'
          expect: blob-unit.json blob-roverwheel.json blob-g0-gate.json blob-examples.json
      - name: Enforce 100% TypeScript coverage over every test file
        run: pnpm exec vitest run --merge-reports --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: error

  consumer:
    name: consumer (node ${{ matrix.node }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - run: node scripts/test-package.mjs candidate

  # The serial page on each engine, bundled from the candidate's dist/, with
  # pure-wasm results compared hex-float-exact against Node records. The
  # COOP/COEP multi page lands with the W3 browser work.
  browser:
    name: browser (${{ matrix.browser }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - name: Use the candidate's dist/
        run: tar -xzf candidate/*.tgz --strip-components=1 package/dist
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps '${{ matrix.browser }}'
      - run: pnpm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}

  # The gating advisory check. osv-scan.yml reports OSV findings on pull
  # requests without blocking them.
  security:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - run: pnpm audit --audit-level high

  # Same-repository pull requests only: the tested candidate, expanded, in one
  # locked pkg-pr-new invocation. Fork pull requests skip both preview jobs.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [candidate, test-unit, test-subjects, coverage, coverage-cpp, consumer, browser, security]
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - run: node scripts/extract-candidate-packages.mjs --from candidate --out preview-packages
      - id: publish
        run: >-
          pnpm exec pkg-pr-new publish
          --previewVersion
          --comment=update
          --commentWithSha
          --json preview.json
          --no-template
          './preview-packages/*'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-pr-new-preview
          path: preview.json
          if-no-files-found: error

  preview-consumer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: pkg-pr-new-preview
          path: preview
          expect: preview.json
      - run: node scripts/extract-candidate-packages.mjs --from candidate --out preview-packages
      - run: node scripts/verify-preview-install.mjs --from preview-packages --metadata preview/preview.json --sha '${{ needs.preview.outputs.sha }}'
      # pkg.pr.new repacks after rewriting the version, so a consumer pins the
      # integrity of the served bytes, not the candidate's.
      - name: Record the served preview integrity
        run: |
          node -e "for (const p of require('./preview/preview.json').packages) console.log(p.url)" | while read -r url; do
            integrity="sha512-$(curl -fsSL "$url" | openssl dgst -sha512 -binary | openssl base64 -A)"
            echo "$url $integrity" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # Inert until PR5 (T1.6): preflight never sets npm-publish, and PR5 adds
  # scripts/registry-wait.mjs and scripts/verify-release-attestations.mjs.
  publish:
    if: needs.preflight.outputs.npm-publish == 'true'
    needs:
      [preflight, candidate, test-unit, test-subjects, coverage, coverage-cpp, consumer, browser, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LATEST }}
          registry-url: https://registry.npmjs.org
      - name: Publish the exact candidate with provenance
        shell: bash
        run: |
          node -e "for (const p of require('./candidate/manifest.json').packages) console.log([p.name,p.version,p.filename,p.integrity].join('\t'))" > /tmp/packages
          while IFS=$'\t' read -r name version filename integrity; do
            published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
            if [[ -n "$published" ]]; then
              if [[ "$published" != "$integrity" ]]; then
                echo "::error::registry integrity differs for $name@$version"
                exit 1
              fi
              continue
            fi
            if [[ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]]; then
              echo "::error::registry returned $name@$version without dist.integrity"
              exit 1
            fi
            npm publish "./candidate/$filename" --access public --provenance </dev/null
          done < /tmp/packages

  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish.result == 'success'
    needs: [preflight, candidate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LATEST }}
          registry-url: https://registry.npmjs.org
      - name: Wait for the registry to serve the candidate with its attestation
        run: node scripts/registry-wait.mjs --manifest candidate/manifest.json
      - name: Verify registry bytes and provenance
        shell: bash
        run: |
          workspace="$PWD"
          directory="$(mktemp -d)"
          cd "$directory"
          npm init --yes >/dev/null
          mapfile -t package_specs < <(node -e "for (const p of require('$workspace/candidate/manifest.json').packages) console.log(p.name+'@'+p.version)")
          npm install --force --ignore-scripts "${package_specs[@]}"
          npm audit signatures --json --include-attestations > /tmp/npm-audit-signatures.json
          cd "$workspace"
          node scripts/verify-release-attestations.mjs \
            /tmp/npm-audit-signatures.json \
            candidate/manifest.json \
            '${{ github.sha }}' \
            '${{ github.run_id }}'
      - name: Record the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v${{ needs.preflight.outputs.version }}'
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target '${{ github.sha }}' --generate-notes

  ci-gate:
    if: always()
    needs:
      [
        preflight,
        wasm,
        quality,
        docs-prose,
        candidate,
        test-unit,
        test-subjects,
        g0,
        benchmark,
        coverage,
        coverage-cpp,
        consumer,
        browser,
        security,
        preview,
        preview-consumer,
        publish,
        registry-verify,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert required job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
          PREVIEW: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = [
            'preflight', 'wasm', 'quality', 'docs-prose', 'candidate', 'test-unit', 'test-subjects', 'g0',
            'benchmark', 'coverage', 'coverage-cpp', 'consumer', 'browser', 'security',
          ];
          const skipped = [];
          if (needs.preflight?.result === 'success' && process.env.PUBLISH === 'true') {
            required.push('publish', 'registry-verify');
          } else {
            skipped.push('publish', 'registry-verify');
          }
          if (process.env.PREVIEW === 'true') required.push('preview', 'preview-consumer');
          else skipped.push('preview', 'preview-consumer');
          const failures = required.filter((name) => needs[name]?.result !== 'success');
          failures.push(...skipped.filter((name) => needs[name]?.result !== 'skipped').map((name) => `${name} (expected skip)`));
          if (failures.length) throw new Error(`required jobs did not pass: ${failures.join(', ')}`);
          console.log(`passed: ${required.join(', ')}; skipped as expected: ${skipped.join(', ') || 'none'}`);
          NODE
