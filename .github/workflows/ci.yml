# The candidate pipeline (PicoVoxel close-out T1.1; create-repo §3). Both wasm
# variants are built once from pinned sources; one candidate tarball is packed
# from them; every test, consumer, browser and preview job exercises those
# exact bytes, and nothing downstream of `wasm` runs emcc. `ci-gate` is the only
# required check. This file name is part of the npm Trusted Publisher identity.
#
# Replaces test.yml. Its macOS leg is dropped rather than scheduled: the wasm is
# platform-independent, the three-engine browser gate covers the Safari claim
# (WebKit), arm64 native parity is a local harness (bench/), and macOS minutes
# cost 10x on a private repository.
#
# OSV scanning is its own workflow (osv-scan.yml: report-only on pull requests,
# blocking on main). Still to come, by owner: the benchmark job, the hard wasm
# byte ceilings and the 2.0 mm candidate G0 pin (W4).
#
# Publication: `preflight` runs scripts/ci-release.mjs once per run. Only a push
# to main whose commit is the exact `chore(release): picovoxel v<version>`
# release commit sets `npm-publish`; pull requests, ordinary main commits and
# manual runs never publish. `publish` then pushes the tested candidate tarball
# to npm through OIDC trusted publishing with provenance, and `registry-verify`
# proves the registry bytes and attestation before recording the GitHub
# release. release-pr.yml maintains the pull request that creates that commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer pull request run cancels the older one. Main pushes and manual runs
# get a group of their own run: GitHub keeps one pending run per group and
# cancels it when a newer run joins, so a shared main group would let any later
# push or dispatch silently drop a queued release run. Publication serializes
# on the `publish` job's own group instead, which only release runs reach.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_FLOOR: '22.14.0'
  NODE_LATEST: '26'
  # Every test file runs exactly once with v8 coverage into a vitest blob; the
  # `coverage` job merges the blobs and enforces the 100% thresholds from
  # vitest.config.ts over the union, as the single-job `npm test` did.
  VITEST_BLOB_FLAGS: >-
    --coverage
    --coverage.reporter=text-summary
    --coverage.thresholds.lines=0
    --coverage.thresholds.functions=0
    --coverage.thresholds.branches=0
    --coverage.thresholds.statements=0
    --reporter=default
    --reporter=blob

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release kind, derived once from immutable event, ref and SHA inputs:
      # the commit subject and the files it changes decide whether this run is
      # a release, and only a release push to main sets npm-publish.
      - id: release
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REF_NAME: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_sha="$(git merge-base "origin/$BASE_REF" "$SOURCE_SHA")"
          else
            base_sha="$(git rev-parse "$SOURCE_SHA^")"
          fi
          git diff --name-only --no-renames --diff-filter=ACDMRT "$base_sha" "$SOURCE_SHA" > /tmp/changed-files
          git diff --name-only --no-renames --diff-filter=D "$base_sha" "$SOURCE_SHA" > /tmp/deleted-files
          git show "$base_sha:package.json" > /tmp/base-package.json
          git show "$SOURCE_SHA:package.json" > /tmp/package.json
          node scripts/ci-release.mjs \
            --event "$EVENT_NAME" \
            --ref "$REF_NAME" \
            --sha "$SOURCE_SHA" \
            --package-version "$(node -p "require('./package.json').version")" \
            --subject "$(git log -1 --pretty=%s "$SOURCE_SHA")" \
            --changed-files-file /tmp/changed-files \
            --deleted-files-file /tmp/deleted-files \
            --base-package-json-file /tmp/base-package.json \
            --package-json-file /tmp/package.json \
            --head-ref "$HEAD_REF" \
            --head-repository "$HEAD_REPOSITORY" \
            --repository "$REPOSITORY"

  # The only place a pull request builds shipped wasm (coverage-cpp builds an
  # instrumented serial variant that never leaves its job). The build steps, and
  # the cache keys that make a near miss impossible, live in
  # .github/actions/build-wasm, which the bench and g0-nightly workflows share
  # for their fallback build.
  wasm:
    name: wasm (${{ matrix.variant }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        variant: [serial, multi]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/build-wasm
        with:
          variant: ${{ matrix.variant }}
      - name: The committed ABI manifest matches the pinned header
        if: matrix.variant == 'serial'
        run: node scripts/parse-abi.mjs | diff -u src/abi.json -
      - name: No builder path is embedded in the shipped bytes (D27)
        run: |
          if grep -aF -c "$GITHUB_WORKSPACE" src/pico*.mjs src/pico*.wasm; then
            echo "::error::a shipped wasm artifact embeds the build path $GITHUB_WORKSPACE"
            exit 1
          fi
      - name: Record sizes, digests and byte ceilings
        run: |
          source vendor/emsdk/emsdk_env.sh >/dev/null 2>&1
          EMCC_VERSION="$(emcc --version | head -n1)" node scripts/wasm-manifest.mjs '${{ matrix.variant }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-${{ matrix.variant }}
          path: |
            src/pico${{ matrix.variant == 'multi' && '-multi' || '' }}.mjs
            src/pico${{ matrix.variant == 'multi' && '-multi' || '' }}.wasm
            src/pico${{ matrix.variant == 'multi' && '-multi' || '' }}.exports.ts
            build/wasm-${{ matrix.variant }}.json
            vendor/PicoGKRuntime/API/PicoGK.h
          if-no-files-found: error

  quality:
    needs: [preflight, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      # Build (which fails on a runtime import cycle), typecheck (after build:
      # examples import the package by name), script tests, JS size budgets, the
      # exact file set, publint and attw. `quality` is exactly this target plus
      # `docs-prose`, which runs in its own job, so no gate runs twice. The suite
      # itself runs sharded below (D28), not here.
      - run: pnpm nx run picovoxel:package-checks
      # A change that can reach the published package needs a pending Version
      # Plan; development-only manifest fields, the lockfile, CI, tooling and
      # docs outside the tarball do not (scripts/plan-check.mjs). The release
      # commit consumes the plans, so release runs skip the check.
      - name: Require a Version Plan for release-affecting changes
        if: needs.preflight.outputs.kind != 'release-pull-request' && needs.preflight.outputs.kind != 'release'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            node scripts/plan-check.mjs --base="origin/$BASE_REF" --head=HEAD
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              echo "::error::Cannot validate Version Plans without a previous push SHA"
              exit 1
            fi
            git merge-base --is-ancestor "$BEFORE_SHA" HEAD || {
              echo "::error::Cannot validate Version Plans across a force-push"
              exit 1
            }
            node scripts/plan-check.mjs --base="$BEFORE_SHA" --head=HEAD
          else
            node scripts/plan-check.mjs --base=HEAD~1 --head=HEAD
          fi

  # Format, type-aware lint, dead code, Vale and the prose tests, actionlint and
  # shellcheck. It downloads the wasm only because lint reads the built dist/
  # types (the examples import the package by name) and the build copies it.
  docs-prose:
    needs: [preflight, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - run: pnpm nx run picovoxel:docs-prose

  candidate:
    needs: [preflight, quality, docs-prose, wasm]
    runs-on: ubuntu-24.04
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      integrity: ${{ steps.pack.outputs.integrity }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - run: pnpm run build
      - id: pack
        run: |
          mkdir -p candidate
          npm pack --ignore-scripts --pack-destination candidate
          node scripts/candidate-manifest.mjs candidate
          # The tarball's real entries equal PACKAGE_FILES, CI-built wasm included.
          node scripts/validate-pack.mjs candidate/*.tgz
          node -e "const m=require('./candidate/manifest.json');for(const p of m.packages)console.log(p.name+'@'+p.version, p.filename, p.integrity)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate
          path: candidate/
          if-no-files-found: error

  # The light files against the sources on the Node floor and latest, with both
  # wasm artifacts in src/ and the pinned header they were built against (the
  # ABI consistency test reads it). The latest leg writes the coverage blob. R14
  # (every export exercised) runs on both artifacts.
  test-unit:
    name: test-unit (node ${{ matrix.node }})
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '26']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts vendor/PicoGKRuntime/API/PicoGK.h
      - name: Light files (coverage blob on the latest leg)
        env:
          COVERAGE: ${{ matrix.node == env.NODE_LATEST }}
        run: |
          if [[ "$COVERAGE" == true ]]; then
            # shellcheck disable=SC2086 # the flags are a word list by design
            pnpm run test:unit $VITEST_BLOB_FLAGS --outputFile.blob=.vitest-reports/blob-unit.json
          else
            pnpm run test:unit
          fi
      - name: R14 on the pthread artifact
        run: pnpm exec vitest run test/tier2.test.mjs
        env:
          PICOVOXEL_R14_ARTIFACT: multi
      - if: matrix.node == env.NODE_LATEST
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-unit
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error

  # The own C++ TUs at 100% lines and functions each, measured by source-based
  # coverage (COVERAGE=1: clang profile instrumentation of the nine TUs only) over
  # the light files. The instrumented serial build replaces src/pico.* in this job
  # alone; the pthread pair comes from `wasm`, because the light files load both.
  # The gate script holds the audited exclusions; regions and branches may not
  # fall below scripts/coverage-cpp-ratchet.json.
  coverage-cpp:
    needs: [preflight, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/build-wasm
        with:
          variant: serial
          coverage: 'true'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm-multi
          path: .
          expect: src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - name: Light files against the instrumented serial build
        env:
          PICOVOXEL_CPP_COVERAGE_DIR: ${{ runner.temp }}/profraw
        run: pnpm run test:unit
      - name: Merge the profiles into lcov and the llvm-cov summary
        env:
          PROFILE_DIR: ${{ runner.temp }}/profraw
          OUT_DIR: coverage/cpp
        run: bash scripts/coverage-cpp-report.sh
      - name: 100% lines and functions per TU; regions and branches ratcheted
        run: node scripts/coverage-cpp-gate.mjs coverage/cpp/lcov.info coverage/cpp/summary.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-cpp
          path: |
            coverage/cpp/lcov.info
            coverage/cpp/report.txt
            coverage/cpp/summary.json
          if-no-files-found: error

  # The heavy subjects (~1,833 s of the suite) are the pin-protection gate, so
  # they run on every pull request (close-out D28), sharded because roverwheel
  # alone takes ~754 s: roverwheel | g0-gate | every other examples-* file. The
  # shards and test-unit partition the suite by construction. They run against
  # the candidate: dist/ is the extracted tarball (examples import the package
  # by name) and src/ holds the same CI-built wasm the tests import directly.
  test-subjects:
    name: test-subjects (${{ matrix.shard }})
    needs: [wasm, candidate]
    strategy:
      fail-fast: false
      matrix:
        shard: [roverwheel, g0-gate, examples]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - name: Use the candidate's dist/
        run: tar -xzf candidate/*.tgz --strip-components=1 package/dist
      - name: Run the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            roverwheel) files=(test/examples-roverwheel.test.ts) ;;
            g0-gate) files=(test/g0-gate.test.ts) ;;
            examples)
              files=()
              for file in test/examples-*.test.ts; do
                [[ "$file" == test/examples-roverwheel.test.ts ]] || files+=("$file")
              done
              ;;
          esac
          echo "shard $SHARD: ${files[*]}"
          # shellcheck disable=SC2086 # the flags are a word list by design
          pnpm exec vitest run "${files[@]}" $VITEST_BLOB_FLAGS --outputFile.blob=".vitest-reports/blob-$SHARD.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: [test-unit, test-subjects]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: 'true'
          expect: blob-unit.json blob-roverwheel.json blob-g0-gate.json blob-examples.json
      - name: Enforce 100% TypeScript coverage over every test file
        run: pnpm exec vitest run --merge-reports --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: error

  consumer:
    name: consumer (node ${{ matrix.node }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - run: node scripts/test-package.mjs candidate

  # Per engine: the serial gate page, bundled from the candidate's dist/, then a
  # Vite build of the installed candidate with a serial page (no isolation
  # headers) and a COOP/COEP multi page whose pthread pool must engage. Every
  # pure-wasm result is compared hex-float-exact against Node records.
  browser:
    name: browser (${{ matrix.browser }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - name: Use the candidate's dist/
        run: tar -xzf candidate/*.tgz --strip-components=1 package/dist
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps '${{ matrix.browser }}'
      - run: pnpm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
      - run: node scripts/test-bundler.mjs candidate
        env:
          BROWSER: ${{ matrix.browser }}

  # The gating advisory check. osv-scan.yml reports OSV findings on pull
  # requests without blocking them.
  security:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - run: pnpm audit --audit-level high

  # Same-repository pull requests only: the tested candidate, expanded, in one
  # locked pkg-pr-new invocation. Fork pull requests skip both preview jobs.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [candidate, test-unit, test-subjects, coverage, coverage-cpp, consumer, browser, security]
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - run: node scripts/extract-candidate-packages.mjs --from candidate --out preview-packages
      - id: publish
        run: >-
          pnpm exec pkg-pr-new publish
          --previewVersion
          --comment=update
          --commentWithSha
          --json preview.json
          --no-template
          './preview-packages/*'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-pr-new-preview
          path: preview.json
          if-no-files-found: error

  preview-consumer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LATEST }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: pkg-pr-new-preview
          path: preview
          expect: preview.json
      - run: node scripts/extract-candidate-packages.mjs --from candidate --out preview-packages
      - run: node scripts/verify-preview-install.mjs --from preview-packages --metadata preview/preview.json --sha '${{ needs.preview.outputs.sha }}'
      # pkg.pr.new repacks after rewriting the version, so a consumer pins the
      # integrity of the served bytes, not the candidate's.
      - name: Record the served preview integrity
        run: |
          node -e "for (const p of require('./preview/preview.json').packages) console.log(p.url)" | while read -r url; do
            integrity="sha512-$(curl -fsSL "$url" | openssl dgst -sha512 -binary | openssl base64 -A)"
            echo "$url $integrity" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # Main-branch release commits only: preflight sets npm-publish for nothing
  # else, and the event and ref are checked again here. The job has no checkout
  # and runs no build: it publishes the candidate tarball every test job
  # exercised, after proving the downloaded bytes are the recorded ones. npm
  # authenticates it through OIDC trusted publishing (taucad/picovoxel, ci.yml);
  # there is no registry token. The npm-publish environment admits only main,
  # so the trusted publisher can also require it (MAINTAINER.md). Re-running
  # the job is safe: a version the registry already serves with the candidate's
  # integrity is skipped, any other integrity fails, and a registry error other
  # than "not found" stops it.
  publish:
    if: needs.preflight.outputs.npm-publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [preflight, candidate, test-unit, test-subjects, coverage, coverage-cpp, consumer, browser, security]
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LATEST }}
          registry-url: https://registry.npmjs.org
      - name: Publish the exact candidate with provenance
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          packages="$(mktemp)"
          node -e "for (const p of require('./candidate/manifest.json').packages) console.log([p.name,p.version,p.filename,p.integrity].join('\t'))" > "$packages"
          test -s "$packages" || { echo "::error::the candidate manifest lists no packages"; exit 1; }
          while IFS=$'\t' read -r name version filename integrity; do
            if [[ "$version" != "$VERSION" ]]; then
              echo "::error::candidate $name is $version, but the release commit is $VERSION"
              exit 1
            fi
            actual="sha512-$(openssl dgst -sha512 -binary "./candidate/$filename" | openssl base64 -A)"
            if [[ "$actual" != "$integrity" ]]; then
              echo "::error::candidate/$filename is not the tested tarball ($actual, recorded $integrity)"
              exit 1
            fi
            view_error="$(mktemp)"
            if published="$(npm view "$name@$version" dist.integrity 2>"$view_error" </dev/null)"; then
              if [[ -z "$published" ]]; then
                echo "::error::registry returned $name@$version without dist.integrity"
                exit 1
              fi
              if [[ "$published" != "$integrity" ]]; then
                echo "::error::registry integrity differs for $name@$version"
                exit 1
              fi
              echo "$name@$version is already published with the candidate's integrity"
              continue
            fi
            if ! grep -q '^npm error code E404$' "$view_error"; then
              cat "$view_error" >&2
              echo "::error::could not read $name@$version from the registry"
              exit 1
            fi
            npm publish "./candidate/$filename" --access public --provenance </dev/null
          done < "$packages"

  # Installs nothing from this checkout: it proves what a consumer gets. It
  # waits for the registry to serve the candidate's integrity with an
  # attestation, installs the exact version into an empty project, has npm
  # verify the registry signatures and attestations, and binds the provenance
  # to taucad/picovoxel, .github/workflows/ci.yml, refs/heads/main, this commit
  # and this run. Only then does it record the GitHub release and its tag.
  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish.result == 'success'
    needs: [preflight, candidate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: npm-candidate
          path: candidate
          expect: manifest.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LATEST }}
          registry-url: https://registry.npmjs.org
      - name: Wait for the registry to serve the candidate with its attestation
        run: node scripts/registry-wait.mjs --manifest candidate/manifest.json --interval-seconds 30 --timeout-minutes 30
      - name: Verify registry bytes and provenance
        shell: bash
        run: |
          workspace="$PWD"
          directory="$(mktemp -d)"
          cd "$directory"
          npm init --yes >/dev/null
          mapfile -t package_specs < <(node -e "for (const p of require('$workspace/candidate/manifest.json').packages) console.log(p.name+'@'+p.version)")
          npm install --ignore-scripts "${package_specs[@]}"
          npm audit signatures --json --include-attestations > /tmp/npm-audit-signatures.json
          cd "$workspace"
          node scripts/verify-release-attestations.mjs \
            /tmp/npm-audit-signatures.json \
            candidate/manifest.json \
            '${{ github.sha }}' \
            '${{ github.run_id }}'
      # `gh release create --target` attaches to a tag that already exists and
      # ignores the target, so an existing tag must already name this commit.
      - name: Record the verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          tag="v$VERSION"
          if refs="$(git ls-remote --exit-code origin "refs/tags/$tag" "refs/tags/$tag^{}")"; then
            tagged="$(awk -v peeled="refs/tags/$tag^{}" '$2 == peeled { print $1 }' <<< "$refs")"
            [[ -n "$tagged" ]] || tagged="$(awk '{ print $1; exit }' <<< "$refs")"
            if [[ "$tagged" != "$SHA" ]]; then
              echo "::error::tag $tag points at $tagged, not the release commit $SHA"
              exit 1
            fi
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::could not list tag $tag (git ls-remote exited $status)"
              exit 1
            fi
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$SHA" --generate-notes

  ci-gate:
    if: always()
    needs:
      [
        preflight,
        wasm,
        quality,
        docs-prose,
        candidate,
        test-unit,
        test-subjects,
        coverage,
        coverage-cpp,
        consumer,
        browser,
        security,
        preview,
        preview-consumer,
        publish,
        registry-verify,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert required job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
          PREVIEW: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = [
            'preflight', 'wasm', 'quality', 'docs-prose', 'candidate', 'test-unit', 'test-subjects',
            'coverage', 'coverage-cpp', 'consumer', 'browser', 'security',
          ];
          const skipped = [];
          if (needs.preflight?.result === 'success' && process.env.PUBLISH === 'true') {
            required.push('publish', 'registry-verify');
          } else {
            skipped.push('publish', 'registry-verify');
          }
          if (process.env.PREVIEW === 'true') required.push('preview', 'preview-consumer');
          else skipped.push('preview', 'preview-consumer');
          const failures = required.filter((name) => needs[name]?.result !== 'success');
          failures.push(...skipped.filter((name) => needs[name]?.result !== 'skipped').map((name) => `${name} (expected skip)`));
          if (failures.length) throw new Error(`required jobs did not pass: ${failures.join(', ')}`);
          console.log(`passed: ${required.join(', ')}; skipped as expected: ${skipped.join(', ') || 'none'}`);
          NODE
