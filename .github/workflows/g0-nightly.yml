# SKv2-0 V0.2 — the nightly G0 identity shape:
# an 11-run identity spike on a rotating fixture, multi lane (the race-prone
# one; the single lane is exercised per-commit by the byte pins and the
# lane-invariant G0 reference in test/g0-gate.test.ts).
#
# 11 runs catches a 1-in-4 race with ~96% confidence in one night; the
# rotation buys condition DIVERSITY, which §14.3 shows beats repetition —
# both historical P0s were p≈1 in an uncovered scale region and p≈0 in the
# covered one. The 0.5 mm HeatX leg is the deep-heap fixture (the SK-0.9/0.10
# defect class only manifests past 2 GiB).
#
# Identity needs no load discipline: host load is recorded in every record,
# never controlled (§14.3) — which is why this CAN run on CI while timing
# benchmarks cannot (bench.yml stays a drift canary only).
#
# The run certifies the artifacts that ship: it checks out the head of the latest
# green ci.yml push run on main and downloads that run's wasm-serial and
# wasm-multi artifacts (built from pinned sources; close-out D3). Only when no
# such run still holds both (they expire after 90 days) does it build them at
# the head of main, with the build steps and cache keys ci.yml uses (Q-A3).
name: g0-nightly

# Manual only while the repository is private (close-out D2, Q-B10): up to 350
# minutes a night would come out of the private plan. The public flip restores
# the nightly schedule it had before:
#   schedule:
#     - cron: '43 3 * * *' # nightly
on:
  workflow_dispatch:

permissions: {}

jobs:
  g0-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Find the wasm to certify
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r run_id sha < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"') || true
          live=0
          if [[ -n "${run_id:-}" ]]; then
            live="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select((.expired | not) and (.name == "wasm-serial" or .name == "wasm-multi"))] | length')"
          fi
          if [[ "$live" == 2 ]]; then
            echo "certifying the wasm of ci.yml run $run_id at $sha"
            { echo "source=download"; echo "run-id=$run_id"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no green main run holds both wasm artifacts; building them at $GITHUB_SHA"
            { echo "source=build"; echo "sha=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ci.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - if: steps.ci.outputs.source == 'download'
        uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: .
          merge-multiple: 'true'
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          expect: src/pico.mjs src/pico.wasm src/pico.exports.ts src/pico-multi.mjs src/pico-multi.wasm src/pico-multi.exports.ts
      - if: steps.ci.outputs.source == 'build'
        uses: ./.github/actions/build-wasm
        with:
          variant: serial
      - if: steps.ci.outputs.source == 'build'
        uses: ./.github/actions/build-wasm
        with:
          variant: multi
      # dist/ is needed at runtime: examples import the package by name.
      - run: pnpm run build
      - name: Pick tonight's fixture (rotation by day-of-year)
        id: rotate
        run: |
          case $(( $(date +%-j) % 3 )) in
            0) echo "fixture=heatx"  >> "$GITHUB_OUTPUT"; echo "size=0.7"  >> "$GITHUB_OUTPUT" ;;
            1) echo "fixture=gyroid" >> "$GITHUB_OUTPUT"; echo "size=0.25" >> "$GITHUB_OUTPUT" ;;
            2) echo "fixture=heatx"  >> "$GITHUB_OUTPUT"; echo "size=0.5"  >> "$GITHUB_OUTPUT" ;;
          esac
      - name: 11-run G0 identity spike
        env:
          FIXTURE: ${{ steps.rotate.outputs.fixture }}
          SIZE: ${{ steps.rotate.outputs.size }}
        run: |
          node bench/g0-identity.mjs triple \
            --fixture "$FIXTURE" \
            --build multi \
            --size "$SIZE" \
            --runs 11 --jsonl g0-nightly.jsonl
      - name: Upload records
        if: always() && steps.rotate.outputs.fixture != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g0-nightly-${{ steps.rotate.outputs.fixture }}-${{ steps.rotate.outputs.size }}
          path: g0-nightly.jsonl
          if-no-files-found: warn
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ steps.rotate.outputs.fixture && format('{0}@{1}mm multi', steps.rotate.outputs.fixture, steps.rotate.outputs.size) || 'setup' }}
        run: |
          gh label create claude --repo "$GITHUB_REPOSITORY" --force \
            --description 'Picked up by Claude automation' --color 5319E7
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --label claude \
            --title "G0 nightly identity failure: $SUBJECT" \
            --body "The G0 nightly run failed ($SUBJECT). If the 11-run identity spike diverged or the oracles disagreed, the records are in the run's artifact: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — treat a divergence as a race until attributed."
