# R26 — benchmark skeleton (quality doc, Finding 4). NEVER gates: CI runner load
# violates the measurement discipline; the checked-in baseline comes from a
# controlled machine. This job exists to catch order-of-magnitude regressions —
# any metric >2× the committed baseline median opens an ISSUE (OQ2 default:
# issues survive force-pushes; commit comments do not). It measures the serial
# artifact of the latest green ci.yml push run on main at that run's head, so
# the numbers describe the bytes that ship; the wasm is never rebuilt here.
name: bench

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *' # monthly

permissions: {}

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Find the latest green CI run on main
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r run_id sha < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"') || true
          if [[ -z "${run_id:-}" ]]; then
            echo "::error::no successful ci.yml push run on main to measure"
            exit 1
          fi
          echo "measuring ci.yml run $run_id at $sha"
          { echo "run-id=$run_id"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ci.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm-serial
          path: .
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          expect: src/pico.mjs src/pico.wasm
      - name: Run benchmarks (loadavg guard relaxed — CI numbers are drift canaries only)
        run: npm run bench -- --allow-loaded
      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench/results/
      - name: Open an issue on >2x drift vs the committed baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create claude --repo "$GITHUB_REPOSITORY" --force \
            --description 'Work for the Claude maintenance loop' --color 5319e7
          node bench/check-drift.mjs --open-issue
