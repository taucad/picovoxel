# Report-only on pull requests (not part of ci-gate), blocking on main and weekly.
# Code scanning on a private repository needs GitHub Advanced Security, so the
# SARIF upload waits for a public repository; an event payload without the
# repository (a scheduled run) skips it rather than failing.
name: OSV scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: OSV scan (report-only)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --config=osv-scanner.toml
      upload-sarif: ${{ github.event.repository.visibility == 'public' }}
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-main:
    name: OSV scan (blocking)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --config=osv-scanner.toml
      upload-sarif: ${{ github.event.repository.visibility == 'public' }}
    permissions:
      actions: read
      contents: read
      security-events: write
