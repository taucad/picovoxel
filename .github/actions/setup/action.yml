name: Setup repository
description: Install the pinned Node and pnpm, then the locked dependencies with bounded retries.
inputs:
  node-version:
    description: Exact Node version or supported major alias.
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false
        version: '11.7.0'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - shell: bash
      run: |
        for attempt in 1 2 3; do
          pnpm install --frozen-lockfile && exit 0
          test "$attempt" = 3 && exit 1
          sleep "$((attempt * 5))"
        done
